<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammaire · ディクテ</title><link rel="stylesheet" href="dictee.css"></head><body><main><a class="back" href="index.html">← 学習アプリへ</a><p class="eyebrow">ÉCOUTER · ÉCRIRE · RETENIR</p><h1>耳から、フランス語を書く。</h1><p>登録した教材音声でディクテ。間違えた文は、あとからもう一度。</p><section class="controls"><label>教材 <select id="lesson" aria-label="教材を選ぶ"><option value="">すべての教材</option></select></label><button id="mistakes">間違えた文だけ</button><button id="all">すべて練習</button><label>速度 <select id="rate" aria-label="再生速度"><option value="0.75">0.75倍</option><option value="0.9">0.9倍</option><option value="1" selected>1倍</option><option value="1.1">1.1倍</option></select></label></section><section class="card"><p id="progress" role="status">音声を読み込んでいます…</p><button class="primary" id="listen">▶ 聞く・もう一度聞く</button><audio id="audio" controls preload="metadata"></audio><form id="answerForm"><label for="answer">聞こえたフランス語を入力</label><textarea id="answer" lang="fr" autocomplete="off" spellcheck="false" rows="4" maxlength="5000"></textarea><div class="actions"><button class="primary" type="submit" id="check">答え合わせ</button><button type="button" id="reveal">正解を見る</button><button type="button" id="next">次の文 →</button></div></form><div id="feedback" aria-live="polite"></div><p id="summary"></p></section><p class="note">大文字・小文字と句読点は区別しません。アクセント記号と単語は確認します。Ctrl／⌘＋Enterで答え合わせ。復習履歴はこの端末に保存します。</p></main><script src="dictee.js"></script></body></html>
